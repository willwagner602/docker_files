# Daily backup of the "media" deployment. The script is shared with the
# general stack (scripts/backup.sh); what to protect is declared entirely in
# the environment below, which scripts/tests/backup/tests.sh cross-references
# against every other service's mounts: adding a container whose state is not
# covered fails `make test` and CI.
#
# Databases are NOT hot-copied: postgres-db-dump (media/postgres.yml) and
# immich-db-dump (media/immich.yml) export pg_dumpall snapshots to
# /bigdisk/db-dumps, which is what gets zipped. The zip lands in the Google
# Drive "Server Backups" directory; this host's hourly rclone bisync replicates
# it to Drive (see rclone-config.md).
services:
  backup:
    image: docker:29-cli
    container_name: backup-media
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # tzdata for BACKUP_AT in local time; zip for the archive itself; sqlite
    # for consistent sqlite3 .backup copies of hot SQLite databases.
    command: sh -c "apk add --no-cache sqlite tzdata zip >/dev/null && exec sh /backup.sh"
    environment:
      - TZ=America/Los_Angeles
      - ROLE=media
      - DEST_DIR=/backups
      - BACKUP_AT=04:00
      - KEEP_DAILY=7
      - KEEP_WEEKLY=11
      - KEEP_MONTHLY=9
      # Host paths to back up, mirroring the host layout inside the zip.
      - BACKUP_PATHS=/config/frigate /home/wbw/health-notify/media /home/wbw/photo-uploader-data /home/wbw/unpackerr /bigdisk/plex/plex /bigdisk/plex/sonarr /bigdisk/plex/radarr /bigdisk/plex/whisparr /bigdisk/plex/ombi /bigdisk/plex/stash/config /bigdisk/plex/stash/metadata /bigdisk/prowlarr /media/qbittorrent/config /bigdisk/sabnzbd/config /bigdisk/db-dumps
      # SQL exports are the database restore points; coverage_check verifies
      # that their containing directory remains declared for backup.
      - REQUIRED_BACKUP_FILES=/bigdisk/db-dumps/postgres-all.sql /bigdisk/db-dumps/immich-all.sql
      # No named volumes are in use by any media service, except Komodo's.
      # The Komodo agent keys live in the named komodo-keys volume.
      - BACKUP_VOLUMES=komodo-keys
      # Service mounts deliberately NOT backed up, with the reason:
      #   /bigdisk/plex, /bigdisk/plex/tv, /bigdisk/plex/movies,
      #     /bigdisk/plex/downloads/*, /bigdisk/plex/xxx
      #       — media libraries and downloads; regenerable from indexers.
      #   /bigdisk/frigate — camera recordings; regenerable.
      #   /bigdisk/immich/library — photos; excluded by decision 2026-10-06
      #     (Drive quota; revisit if a dedicated photo backup appears).
      #   /bigdisk/immich/model-cache, /bigdisk/plex/stash/generated,
      #     /bigdisk/plex/stash/cache — regenerable caches/previews.
      #   /bigdisk/immich/postgres, /bigdisk/plex/database — live database
      #     data dirs, replaced by the pg_dumpall exports in /bigdisk/db-dumps.
      #   /bigdisk/photos — photo-uploader source, read-only input.
      #   /bigdisk/google-drive/Photos — immich's read-only view of the
      #     Google Drive mirror; regenerable from Google, so not backed up.
      #   /proc — host process table mounted for the Komodo agent.
      #   /etc/komodo — Periphery root dir for Komodo-managed stacks; empty
      #     in this monitoring-only setup.
      #   /bigdisk/backblaze-personal/config and /home/wbw/backblaze-drive-markers/*
      #     — sensitive client state and volume identities; preserved separately
      #     in restricted recovery checkpoints, not the routine archive.
      #   /bigdisk/google-drive — upstream mirror, regenerable from Google Drive.
      - EXCLUDED_MOUNTS=/var/run/docker.sock /etc/localtime /bigdisk/plex /bigdisk/plex/tv /bigdisk/plex/movies /bigdisk/plex/downloads/xxx-inbox /bigdisk/plex/downloads/whisparr /bigdisk/plex/xxx /bigdisk/plex/stash/generated /bigdisk/plex/stash/cache /bigdisk/frigate /bigdisk/immich/library /bigdisk/immich/model-cache /bigdisk/immich/postgres /bigdisk/plex/database /path/to/photos /proc /etc/komodo /bigdisk/google-drive/Photos /bigdisk/photos /bigdisk/backblaze-personal/config /home/wbw/backblaze-drive-markers/d /home/wbw/backblaze-drive-markers/e /bigdisk/google-drive /home/wbw/work/docker_files/scripts/health-notify.sh
      # Additional paths with backup coverage that are not mounted by a service.
      - EXTRA_BACKUP_PATHS=
      # Zip-level excludes. Restates the script defaults (WAL/SHM sidecars,
      # IPC sockets), skips application logs (~375 MB), and trims Plex's
      # config to the library/blobs databases + Preferences.xml (decision
      # 2026-10-12): snapshots, Media bundles, Metadata, Cache, Codecs,
      # Crash Reports, Updates, and the arr-app MediaCover image caches all
      # regenerate after a restore. The * wildcards also stand in for spaces
      # in Plex's directory names.
      - EXCLUDES=*home-assistant_v2.db-wal *home-assistant_v2.db-shm *etc-pihole/*-wal *etc-pihole/*-shm *ipc-socket *Plex*Media*Server/Logs/* bigdisk/prowlarr/logs/* bigdisk/sabnzbd/config/logs/* bigdisk/plex/radarr/logs/* bigdisk/plex/sonarr/logs/* bigdisk/plex/whisparr/logs/* bigdisk/plex/ombi/Logs/* media/qbittorrent/config/data/logs/* home/wbw/unpackerr/*.log* *Plex*Media*Server/Cache/* *Plex*Media*Server/Metadata/* *Plex*Media*Server/Media/* *Plex*Media*Server/Codecs/* *Plex*Media*Server/Crash*Reports/* *Plex*Media*Server/Updates/* *Plex*Media*Server/Plug-in*Support/Databases/*db-2* bigdisk/plex/stash/config/blobs/* bigdisk/plex/radarr/MediaCover/* bigdisk/plex/sonarr/MediaCover/* bigdisk/plex/whisparr/MediaCover/*
      # The run lock lives on local disk (mounted at /locks), outside the
      # synced google-drive mirror, so it is never part of the Drive content
      # and never couples this stack to the general stack on the other host.
      - BACKUP_LOCK_DIR=/locks
    volumes:
      - ../scripts/backup.sh:/backup.sh:ro
      - "/bigdisk/google-drive/Server Backups:/backups"
      # --- protected bind-mount state (read-only) ---
      - /config/frigate:/backup-roots/config/frigate:ro
      - /home/wbw/health-notify/media:/backup-roots/home/wbw/health-notify/media:ro
      - /home/wbw/photo-uploader-data:/backup-roots/home/wbw/photo-uploader-data:ro
      - /home/wbw/unpackerr:/backup-roots/home/wbw/unpackerr:ro
      - /bigdisk/plex/plex:/backup-roots/bigdisk/plex/plex:ro
      - /bigdisk/plex/sonarr:/backup-roots/bigdisk/plex/sonarr:ro
      - /bigdisk/plex/radarr:/backup-roots/bigdisk/plex/radarr:ro
      - /bigdisk/plex/whisparr:/backup-roots/bigdisk/plex/whisparr:ro
      - /bigdisk/plex/ombi:/backup-roots/bigdisk/plex/ombi:ro
      - /bigdisk/plex/stash/config:/backup-roots/bigdisk/plex/stash/config:ro
      - /bigdisk/plex/stash/metadata:/backup-roots/bigdisk/plex/stash/metadata:ro
      - /bigdisk/prowlarr:/backup-roots/bigdisk/prowlarr:ro
      - /media/qbittorrent/config:/backup-roots/media/qbittorrent/config:ro
      - /bigdisk/sabnzbd/config:/backup-roots/bigdisk/sabnzbd/config:ro
      - /bigdisk/db-dumps:/backup-roots/bigdisk/db-dumps:ro
      # --- protected named volumes (read-only) ---
      - komodo-keys:/volume-roots/komodo-keys:ro
      # --- run lock (local disk, outside the synced mirror) ---
      - /bigdisk/backup-locks:/locks
