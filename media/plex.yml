services:
  plex:
    image: linuxserver/plex
    container_name: plex
    restart: unless-stopped
    ports:
      - 32400:32400/tcp
      - 3005:3005/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    environment:
      - PUID=1001
      - PGID=1001
      - VERSION=docker
      - PLEX_CLAIM=claim-nxB1xXcXiSxxmT76p_m_
      - TZ=America/Los_Angeles
    volumes:
      - /bigdisk/plex/plex:/config
      - /bigdisk/plex/tv:/tv
      - /bigdisk/plex/movies:/movies
