services:
  plex:
    image: linuxserver/plex:1.43.4.10903-e5521bd8c-ls327@sha256:06e07af2851e6a822e89062b148435495dd794d6d5aaf36247dee05fb3dcc4b8
    container_name: plex
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:32400/identity >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    ports:
      - 32400:32400/tcp
      - 3005:3005/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    environment:
      - PUID=1001
      - PGID=1001
      - VERSION=docker
      # Claim token from https://plex.tv/claim — expires ~4 minutes after issue,
      # so set it in media/.env immediately before the first `up` and then clear it.
      - PLEX_CLAIM=${PLEX_CLAIM:?Set PLEX_CLAIM in .env from https://plex.tv/claim}
      - TZ=America/Los_Angeles
    volumes:
      - /bigdisk/plex/plex:/config
      - /bigdisk/plex/tv:/tv
      - /bigdisk/plex/movies:/movies
