services:
  sabnzbd:
    container_name: sabnzbd
    image: ghcr.io/hotio/sabnzbd:latest@sha256:257bc0cc308af77a214f071867dc414f7dbe0bf0f31a1f520c531377d338f610
    restart: unless-stopped
    labels:
      - autoheal=true
    healthcheck:
      # Check the local WebUI, not an external IP: VPN/provider outages should
      # not mark a functioning SABnzbd process unhealthy and trigger autoheal.
      test: ["CMD-SHELL", "curl -fsS --max-time 8 -o /dev/null http://127.0.0.1:9090/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    ports:
      - "9090:9090"
    environment:
      - PUID=1001
      - PGID=1001
      - UMASK=002
      - TZ=America/Los_Angeles
      - WEBUI_PORTS=9090/tcp,9090/udp
      - VPN_ENABLED=true #
      - VPN_CONF=wg0 #
      - VPN_PROVIDER=pia #
      - VPN_LAN_NETWORK=10.0.0.0/24 #
      - VPN_LAN_LEAK_ENABLED=false #
      - VPN_EXPOSE_PORTS_ON_LAN=9090/tcp #
      - VPN_AUTO_PORT_FORWARD=true #
      - VPN_AUTO_PORT_FORWARD_TO_PORTS= #
      - VPN_FIREWALL_TYPE=auto #
      - VPN_HEALTHCHECK_ENABLED=false #
      - VPN_NAMESERVERS= #
      - VPN_PIA_USER=${PIA_USER} #
      - VPN_PIA_PASS=${PIA_PASS} #
      - VPN_PIA_PREFERRED_REGION #
      - VPN_PIA_DIP_TOKEN=no #
      - VPN_PIA_PORT_FORWARD_PERSIST=false #
      - PRIVOXY_ENABLED=false #
      - UNBOUND_ENABLED=false #
      - UNBOUND_NAMESERVERS #
    volumes:
      - /bigdisk/sabnzbd/config:/config
      - /bigdisk/plex:/data
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1 #
      - net.ipv6.conf.all.disable_ipv6=1 #
