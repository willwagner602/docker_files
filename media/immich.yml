services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:?set IMMICH_VERSION in .env}@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
    container_name: immich-server
    restart: unless-stopped
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    environment:
      - TZ=America/Los_Angeles
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=${IMMICH_DB_USERNAME:-immich}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD:?set a strong Immich DB password in .env}
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME:-immich}
      - REDIS_HOSTNAME=immich-redis
    volumes:
      - ${IMMICH_UPLOAD_LOCATION:-/bigdisk/immich/library}:/data
      - /bigdisk/google-drive/Photos:/mnt/google-drive-photos:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-postgres:
        condition: service_healthy
    # No autoheal label: Immich's first-boot and post-upgrade DB migrations run
    # longer than the image healthcheck's grace period, so the container goes
    # "unhealthy" mid-migration. autoheal would then SIGTERM it into a restart
    # loop (and risk interrupting a migration). `restart: unless-stopped` plus the
    # image's own healthcheck are sufficient here.
    healthcheck:
      test: ["CMD-SHELL", "immich-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15m

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:?set IMMICH_VERSION in .env}@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e
    container_name: immich-machine-learning
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - /bigdisk/immich/model-cache:/cache
    healthcheck:
      disable: false

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    container_name: immich-redis
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${IMMICH_DB_USERNAME:-immich}
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD:?set a strong Immich DB password in .env}
      - POSTGRES_DB=${IMMICH_DB_DATABASE_NAME:-immich}
      - POSTGRES_INITDB_ARGS=--data-checksums
      - DB_STORAGE_TYPE=HDD
    volumes:
      - ${IMMICH_DB_DATA_LOCATION:-/bigdisk/immich/postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false

  # Daily pg_dumpall export consumed by the backup service (media/backup.yml).
  # Hot-copying /var/lib/postgresql/data can capture the database mid-write, so
  # the backup zips this SQL snapshot instead of the raw data dir. This is the
  # same export Immich's own restore docs call for. One dump per day
  # (start + every 24h), atomically replaced; a failed dump retries every 5
  # minutes instead of waiting out the 24h sleep. History comes from the zip
  # retention schedule, not from this directory.
  immich-db-dump:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-db-dump
    restart: unless-stopped
    # This container has no local postgres: it only runs pg_dumpall against
    # immich-postgres. Check the completed export instead; a missing, empty, or
    # older-than-25-hours dump marks this service unhealthy for health-notify.
    healthcheck:
      test: ["CMD-SHELL", "test -s /dumps/immich-all.sql && find /dumps/immich-all.sql -mmin -1500 -print -quit | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    depends_on:
      immich-postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PGPASSWORD=${IMMICH_DB_PASSWORD:?set a strong Immich DB password in .env}
    volumes:
      - /bigdisk/db-dumps:/dumps
    command: >-
      sh -c 'while :; do
      if pg_dumpall -h immich-postgres -U ${IMMICH_DB_USERNAME:-immich} --clean --if-exists > /dumps/immich-all.sql.part
      && mv /dumps/immich-all.sql.part /dumps/immich-all.sql; then
      echo "$$(date -u +%FT%TZ) immich dump ok"; sleep 86400;
      else
      echo "$$(date -u +%FT%TZ) immich dump FAILED; retrying in 5m";
      rm -f /dumps/immich-all.sql.part; sleep 300; fi; done'
