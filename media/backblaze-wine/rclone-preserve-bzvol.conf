# Based on the installed rclone-gdrive-sync.service inspected 2026-10-09.
# Preserve only the root Backblaze mountpoint; do not add --delete-excluded.
# ExecStart must be reset because systemd cannot append command arguments.
[Service]
ExecStart=
ExecStart=/home/wbw/.local/bin/rclone sync gdrive: /bigdisk/google-drive \
    --config=/home/wbw/.config/rclone/rclone.conf \
    --fast-list \
    --transfers=8 \
    --checkers=16 \
    --track-renames \
    --create-empty-src-dirs \
    --max-delete=500 \
    --exclude /.bzvol/** \
    --retries=3 \
    --low-level-retries=10 \
    --log-level=INFO
