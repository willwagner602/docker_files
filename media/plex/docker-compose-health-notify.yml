services:
  health-notify:
    image: docker:cli
    container_name: health-notify
    restart: unless-stopped
    command: sh -c "apk add --no-cache ca-certificates curl jq openssl >/dev/null && sh /notify.sh"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SAB_API_KEY=${SAB_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - STATE_DIR=/state
      - POLL_INTERVAL=60
      - STALL_SECONDS=3600
      - DISK_FREE_THRESHOLD=25
      - CERT_WARN_DAYS=30
      - CERT_HOST=willwagner.me
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/wbw/scripts/health-notify.sh:/notify.sh:ro
      - /home/wbw/health-notify:/state
      - /media/plex:/data:ro
