services:
  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr
    restart: unless-stopped
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    ports:
      - "9696:9696"
    environment:
      - PUID=1001
      - PGID=1001
      - UMASK=002
      - TZ=America/Los_Angeles
    volumes:
      - /bigdisk/prowlarr/:/config
    hostname: container-name.internal #
