services:
  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      - PUID=1001
      - PGID=1001
      - UMASK=002
      - TZ=America/Los_Angeles
    volumes:
      - /bigdisk/prowlarr/:/config
    hostname: container-name.internal #
