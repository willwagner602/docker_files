services:
  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:latest@sha256:241b6af1b823988be9ea07c1bd45c93d5570e7612ed8d6b428aa696852034295
    restart: unless-stopped
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    ports:
      - "9696:9696"
    environment:
      - PUID=1001
      - PGID=1001
      - UMASK=002
      - TZ=America/Los_Angeles
    volumes:
      - /bigdisk/prowlarr/:/config
    hostname: container-name.internal #
