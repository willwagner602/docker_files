services:
  postgres:
    image: postgres:16@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae
    container_name: postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plex -d ombi && psql -U plex -d ombi -c 'SELECT 1' >/dev/null && psql -U plex -d ombi_settings -c 'SELECT 1' >/dev/null && psql -U plex -d ombi_external -c 'SELECT 1' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      - POSTGRES_USER=plex
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ombi
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - /bigdisk/plex/database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  # Daily pg_dumpall export consumed by the backup service (media/backup.yml).
  # Hot-copying /var/lib/postgresql/data can capture the database mid-write, so
  # the backup zips this SQL snapshot instead of the raw data dir. One dump per
  # day (start + every 24h), atomically replaced; a failed dump retries every
  # 5 minutes instead of waiting out the 24h sleep. History comes from the zip
  # retention schedule, not from this directory.
  postgres-db-dump:
    image: postgres:16@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae
    container_name: postgres-db-dump
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -s /dumps/postgres-all.sql && find /dumps/postgres-all.sql -mmin -1500 -print -quit | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /bigdisk/db-dumps:/dumps
    command: >-
      sh -c 'while :; do
      if pg_dumpall -h postgres -U plex --clean --if-exists > /dumps/postgres-all.sql.part
      && mv /dumps/postgres-all.sql.part /dumps/postgres-all.sql; then
      echo "$$(date -u +%FT%TZ) postgres dump ok"; sleep 86400;
      else
      echo "$$(date -u +%FT%TZ) postgres dump FAILED; retrying in 5m";
      rm -f /dumps/postgres-all.sql.part; sleep 300; fi; done'
