services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plex -d ombi && psql -U plex -d ombi -c 'SELECT 1' >/dev/null && psql -U plex -d ombi_settings -c 'SELECT 1' >/dev/null && psql -U plex -d ombi_external -c 'SELECT 1' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      - POSTGRES_USER=plex
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ombi
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - /bigdisk/plex/database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
