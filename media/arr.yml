services:
  sonarr:
    image: linuxserver/sonarr:3.0.10@sha256:4f69472a0cdea29e23967db6a3395487539b759def3920327d1f49ae00b9dfd4
    container_name: sonarr
    restart: unless-stopped
    environment:
      - UMASK_SET=022
      - TZ=America/Los_Angeles
      - PUID=1001
      - PGID=1001
    volumes:
      - /bigdisk/plex/:/data
      - /bigdisk/plex/sonarr:/config
    ports:
      - 8989:8989/tcp
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
  radarr:
    image: linuxserver/radarr:4.4.4@sha256:4d7f994cbf5f27ccae86c86bb600c2db7c7a0f2b106b58419241b1a1c4c3ea39
    container_name: radarr
    restart: unless-stopped
    environment:
      - UMASK_SET=022
      - TZ=America/Los_Angeles
      - PUID=1001
      - PGID=1001
    volumes:
      - /bigdisk/plex/:/data
      - /bigdisk/plex/radarr:/config
    ports:
      - 7878:7878/tcp
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7878/ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
  whisparr:
    image: ghcr.io/hotio/whisparr:nightly@sha256:13f14e5cd86012f775cc07fe672cd279a295ef41605b8fc3ebfb47583bf50eac
    container_name: whisparr
    restart: unless-stopped
    environment:
      - PUID=1001
      - PGID=1001
      - UMASK=002
      - TZ=America/Los_Angeles
    volumes:
      - /bigdisk/plex/:/data
      - /bigdisk/plex/whisparr:/config
    ports:
      - 6969:6969/tcp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6969/ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
  stash:
    image: stashapp/stash:latest@sha256:df744af5a0c976e2ec671052ecc1f8a9aa757fa12b8f9930b59910b7295f0da6
    container_name: stash
    restart: unless-stopped
    user: "1001:1001"
    environment:
      - TZ=America/Los_Angeles
      - USER=media
      - STASH_CONFIG_FILE=/config/config.yml
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      - STASH_PORT=9999
    volumes:
      - /bigdisk/plex/stash/config:/config
      # Scan legacy collection torrents in place without risking qBittorrent's files.
      - /bigdisk/plex/downloads/xxx-inbox:/data/inbox:ro
      # Allow Stash to scan Whisparr downloads in place; keep qBittorrent files untouched.
      - /bigdisk/plex/downloads/whisparr:/data/whisparr-downloads:ro
      # Scan Whisparr's organized library without exposing other Plex media.
      - /bigdisk/plex/xxx:/data/xxx:ro
      - /bigdisk/plex/stash/metadata:/metadata
      - /bigdisk/plex/stash/cache:/cache
      - /bigdisk/plex/stash/generated:/generated
    ports:
      - 9999:9999/tcp
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9999/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
  unpackerr:
    image: golift/unpackerr:latest@sha256:4ec141eeb0cb2f971d7c92f21cc40b0d2d50d7920eb7a0557443cca52270c0b0
    container_name: unpackerr
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
      - UN_LOG_FILE=/config/unpackerr.log
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/data
      - UN_SONARR_0_PROTOCOLS=torrent,TorrentDownloadProtocol
      - UN_SONARR_0_DELETE_ORIG=false
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/data
      - UN_RADARR_0_PROTOCOLS=torrent,TorrentDownloadProtocol
      - UN_RADARR_0_DELETE_ORIG=false
    volumes:
      - /bigdisk/plex:/data
      - /home/wbw/unpackerr:/config
