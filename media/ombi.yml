services:
  ombi:
    image: linuxserver/ombi
    container_name: ombi
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=America/Los_Angeles
      - BASE_URL=/ombi #optional
    volumes:
      - /bigdisk/plex/ombi:/config
    ports:
      - 3579:3579
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3579/ombi/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
