name: canary

on:
  push:
    branches: [ci/forgejo-canary]

jobs:
  probe:
    runs-on: docker
    steps:
      - name: checkout via remote action
        uses: https://data.forgejo.org/actions/checkout@v4
      - name: docker CLI + daemon socket
        run: docker version --format 'server={{.Server.Version}}'
      - name: compose plugin
        run: docker compose version
      - name: buildx plugin
        run: docker buildx version
      - name: toolchain versions
        run: go version && node --version && git --version
