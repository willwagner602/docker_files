name: canary

on:
  push:
    branches: [ci/forgejo-canary]

jobs:
  probe:
    runs-on: docker
    steps:
      - name: checkout via remote action
        uses: https://data.forgejo.org/actions/checkout@v4
      - name: docker CLI present?
        run: docker version --format 'server={{.Server.Version}}' 2>&1 || echo NO_DOCKER_CLI
      - name: compose plugin present?
        run: docker compose version 2>&1 || echo NO_COMPOSE
      - name: toolchain versions
        run: node --version && git --version && curl --version | head -1
