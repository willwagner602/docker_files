services:
  mindwtr-cloud:
    image: ghcr.io/dongdongbh/mindwtr-cloud:latest@sha256:8d3281f99858130475a1f37552bad0ca2cf274f53c4022a9915878433792c2a1
    container_name: mindwtr-cloud
    restart: unless-stopped
    environment:
      # One token per dataset, not per device: the token is hashed to the
      # namespace filename, so two devices sync together only by sharing one
      # token. The server refuses to start without an allowlist, and an unlisted
      # token is rejected with 401 rather than being granted a new namespace.
      MINDWTR_CLOUD_AUTH_TOKENS: ${MINDWTR_CLOUD_AUTH_TOKENS:?Set MINDWTR_CLOUD_AUTH_TOKENS in .env}
      # Required in production; the server refuses "*".
      MINDWTR_CLOUD_CORS_ORIGIN: ${MINDWTR_CLOUD_CORS_ORIGIN:?Set MINDWTR_CLOUD_CORS_ORIGIN in .env}
      MINDWTR_CLOUD_DATA_DIR: /app/cloud_data
      NODE_ENV: production
      # Optional. Off by default: Nginx Proxy Manager's address on the shared
      # network is assigned dynamically, so enabling this without pinning that
      # address leaves every request looking like it came from one client. Only
      # affects auth-failure throttling and log readability, never authorization.
      MINDWTR_CLOUD_TRUST_PROXY_HEADERS: ${MINDWTR_CLOUD_TRUST_PROXY_HEADERS:-}
      MINDWTR_CLOUD_TRUSTED_PROXY_IPS: ${MINDWTR_CLOUD_TRUSTED_PROXY_IPS:-}
    volumes:
      - /home/wbw/mindwtr:/app/cloud_data
    networks:
      - mindwtr-net

networks:
  mindwtr-net:
    name: mindwtr-net
    driver: bridge
