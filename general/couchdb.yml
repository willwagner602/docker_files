services:
  couchdb:
    image: couchdb:3.5@sha256:8cf5f8442585c346d2717ff0ad95605731d2f19f67b8367840baa8d3b24ebc31
    container_name: couchdb
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Set COUCHDB_USER in .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    volumes:
      - /mnt/halfToshibaB/docker/data/couchdb/data:/opt/couchdb/data
      - /mnt/halfToshibaB/docker/data/couchdb/etc:/opt/couchdb/etc/local.d
    networks:
      - couchdb-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/5984 && AUTH=$(printf ''%s:%s'' "$$COUCHDB_USER" "$$COUCHDB_PASSWORD" | base64 -w0) && printf ''GET /_up HTTP/1.0\r\nHost: localhost\r\nAuthorization: Basic %s\r\n\r\n'' "$$AUTH" >&3 && grep -q ''200 OK'' <&3']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  couchdb-net:
    name: couchdb-net
    driver: bridge
