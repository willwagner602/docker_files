services:
  
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - /home/wbw/docker:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    privileged: true
    network_mode: host
    devices:
      - /dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_fedf64994d93eb11a394194f3d98b6d1-if00-port0:/dev/zigbee
  
  zwavejsui:
    container_name: zwave-js-ui
    image: zwavejs/zwave-js-ui:latest
    restart: always
    tty: true
    stop_signal: SIGINT
    environment:
      - SESSION_SECRET=mysupersecretkey
      - TZ=America/Los_Angeles
    networks:
      - zwave
    devices:
      - /dev/serial/by-id/usb-0658_0200-if00:/dev/zwave
      - /dev/ttyACM0:/dev/zwave1
    volumes:
      - zwave-config:/usr/src/app/store
    ports:
      - '8091:8091' # port for web interface
      - '3000:3000' # port for Z-Wave JS websocket server

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "2080:80/tcp"
      - "20443:443/tcp"
    environment:
      TZ: 'America/Chicago'
      FTLCONF_webserver_api_password: 'na5RNtPM'
      FTLCONF_dns_listeningMode: 'all'
    # Volumes store your data between container upgrades
    volumes:
      - './etc-pihole/:/etc/pihole/'
      - './etc-dnsmasq.d/:/etc/dnsmasq.d/'
    restart: unless-stopped

  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - npm

  unifi-db:
    image: docker.io/mongo:noble
    container_name: unifi-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_USER=unifi
      - MONGO_PASS=password
      - MONGO_DBNAME=unifi
      - MONGO_AUTHSOURCE=admin
    volumes:
      - /home/wbw/mongo/db:/data/db
      - /home/wbw/mongo/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    networks:
      - unifi-net
    restart: unless-stopped

  unifi:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - MONGO_USER=unifi
      - MONGO_PASS=password
      - MONGO_HOST=unifi-db
      - MONGO_PORT=27017
      - MONGO_DBNAME=unifi
      - MONGO_AUTHSOURCE=admin
      - MEM_LIMIT=1024 #optional
      - MEM_STARTUP=1024 #optional
    volumes:
      - /home/wbw/unifi-config:/config
    ports:
      - 8443:8443
      - 3478:3478/udp
      - 10001:10001/udp
      - 8080:8080
      - 1900:1900/udp #optional
      - 8843:8843 #optional
      - 8880:8880 #optional
      - 6789:6789 #optional
      - 5514:5514/udp #optional
    networks:
      - unifi-net
    restart: unless-stopped

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    environment:
      - WG_HOST=vpn.willwagner.me
    networks:
      - npm
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: home
    environment:
      - TS_HOSTNAME=home
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--advertise-routes=10.0.0.0/24 --advertise-exit-node
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    restart: unless-stopped

  otrecorder:
    image: owntracks/recorder
    ports:
      - 8083:8083
    volumes:
      - otr-config:/config
      - otr-store:/store
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto
    ports:
      - 1883:1883
      - 8883:8883
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/logs
      - mosquitto-conf:/mosquitto/config
    restart: unless-stopped

  job-digest:
    build:
      context: /home/wbw/work/job-search-tooling
      dockerfile: Dockerfile

    container_name: job-digest
    restart: unless-stopped

    environment:
      TZ: America/Los_Angeles
      JOB_DIGEST_DIR: /app/.job_digest
      JOB_DIGEST_SECRETS: /app/secrets.json
      JOB_DIGEST_HOST: 0.0.0.0
      JOB_DIGEST_PORT: "8765"

    ports:
      - "8765:8765"

    volumes:
      - ./secrets.json:/app/secrets.json:ro
      - ./job-digest-state:/app/.job_digest

  self-update-server:
    container_name: self-update-server
    build:
      context: /home/wbw/work/self-update-server
      target: server
    # Port is intentionally not published; access is through the npm Docker network.
    restart: unless-stopped
    networks:
      - npm
    volumes:
      - /home/wbw/work/self-update-server/releases:/releases:ro

  self-update-worker:
    container_name: self-update-worker
    build:
      context: /home/wbw/work/self-update-server
      target: worker
    restart: unless-stopped
    volumes:
      - /home/wbw/work/self-update-server/releases:/releases:rw
      - /home/wbw/work/self-updater:/src/self-updater:ro
      - /home/wbw/keys/signing-key:/run/secrets/signing-key:ro
    env_file:
      - /home/wbw/work/self-update-server/config.env
    environment:
      RELEASE_DIR: /releases
      BUILD_SCRIPT: /src/self-update-server/build.sh

networks:
  zwave:
  npm:
    driver: bridge
  unifi-net:

volumes:
  zwave-config:
  unifi-config:
  etc_wireguard:
  otr-store:
  otr-config:
  tailscale-state:
  mosquitto-data:
  mosquitto-logs:
  mosquitto-conf:
