# mDNS reflector: re-announces AirPlay/Chromecast services between the Trusted
# LAN (VLAN 1, untagged 10.0.0.0/24) and IoT Insecure (VLAN 3, 10.0.3.0/24).
#
# mDNS deliberately does not cross VLANs; cast targets on IoT VLANs otherwise
# disappear from phones. This runs Avahi in reflector mode with a service-type
# filter so only cast/airplay announcements are replayed — nothing else crosses
# the boundary, and the camera / IoT-HA zones are never reflected at all.
#
# Image: flungo/avahi (https://github.com/flungo-docker/avahi) — Alpine Avahi
# daemon whose env vars map 1:1 onto avahi-daemon.conf sections.
#
# Host prerequisites (see docs/iot-migration.md in this repo):
#   - parent interfaces below use wbw-ha's wired NIC: enp3s0 (VLAN 1 native).
#   - Switch port (USW-Lite-16-PoE port 16) must carry VLAN 3 tagged.
#   - Static IPs must sit outside both DHCP pools.

services:
  mdns-reflector:
    image: flungo/avahi@sha256:99e7c07662c9cb5ab450d8ea4d39cf25d4aadbb98e99b1ebcf16d006682a5cfc
    container_name: mdns-reflector
    restart: unless-stopped
    # flungo/avahi needs a writable /var/run for its pid/state dir; tmpfs
    # /run fixes the "Failed to create runtime directory" crash-loop.
    tmpfs:
      - /run
      # Stop the reflector advertising its own ssh/sftp placeholders: an empty
      # tmpfs over the image's stock service definitions leaves it acting as
      # a pure reflector.
      - /etc/avahi/services
    environment:
      SERVER_HOST_NAME: mdns-reflector
      REFLECTOR_ENABLE_REFLECTOR: "yes"
      # Only replay the service types that must cross; everything else stays
      # zone-local. Extend if another service type is later needed.
      REFLECTOR_REFLECT_FILTERS: "_airplay._tcp.local,_raop._tcp.local,_googlecast._tcp.local"
      SERVER_USE_IPV4: "yes"
      SERVER_USE_IPV6: "no"
    networks:
      trusted:
        ipv4_address: 10.0.0.222
      iot-insecure:
        ipv4_address: 10.0.3.222
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Physical-network attachments. The reflector needs one interface per zone;
# the macvlan driver creates the enp3s0.3 VLAN sub-interface itself.
networks:
  trusted:
    name: lan-trusted-mdns
    driver: macvlan
    driver_opts:
      parent: enp3s0 # untagged/native VLAN 1
    ipam:
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.1
  iot-insecure:
    name: lan-iot3-mdns
    driver: macvlan
    driver_opts:
      parent: enp3s0.3 # tagged VLAN 3
    ipam:
      config:
        - subnet: 10.0.3.0/24
          gateway: 10.0.3.1
