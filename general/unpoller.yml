services:
  unifi-influxdb:
    image: docker.io/influxdb:1.8-alpine
    container_name: unifi-influxdb
    # SECURITY MODEL (deliberate): InfluxDB 1.8 auth is DISABLED by default and
    # intentionally left off here. The 127.0.0.1 host publish keeps the LAN out,
    # and the unifi-mon Docker network is a private trust domain — only the
    # three services in this file attach to it. Anything granting a container
    # access to unifi-mon implicitly grants full read/write on the unifi DB
    # (no credentials). Enabling INFLUXDB_HTTP_AUTH_ENABLED would also require
    # threading credentials through unpoller.env and the Grafana datasource;
    # revisit if unifi-mon ever gains a member outside this file.
    environment:
      - INFLUXDB_DB=unifi
      - TZ=America/Los_Angeles
    volumes:
      - /mnt/halfToshibaB/docker/data/unpoller/influx:/var/lib/influxdb
    ports:
      - "127.0.0.1:8086:8086" # host-networked HA writes here; not LAN-exposed
    networks:
      - unifi-mon
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  unpoller:
    image: ghcr.io/unpoller/unpoller:latest
    container_name: unpoller
    depends_on:
      - unifi-influxdb
    env_file:
      - unpoller.env
    environment:
      - TZ=America/Los_Angeles
    networks:
      - unifi-mon
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  unifi-grafana:
    image: docker.io/grafana/grafana:latest
    container_name: unifi-grafana
    depends_on:
      - unifi-influxdb
    user: "1000:1000"
    env_file:
      - unpoller.env
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - /mnt/halfToshibaB/docker/data/unpoller/grafana:/var/lib/grafana
      - ./unpoller-grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000" # admin surface; not reachable off-host
    networks:
      - unifi-mon
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  unifi-mon:
