# Live UniFi client snapshot as a webpage: which devices are on which VLAN.
#
# Serves an auto-refreshing HTML table (and a JSON endpoint) of every client
# the controller currently sees — IP, VLAN/network, wired/wifi, ESSID/switch
# port, last-seen, and traffic counters. This is the "did it land where
# intended" view for the VLAN migration, and the steady-state drift detector
# afterwards.
#
# Read-only against the controller (legacy /api/login path). Port 8092 is
# LAN-only — treat it as an admin surface; do not expose via nginx-proxy.
#
# UNIFI_PASSWORD comes from .env (same as the rest of the stack).

services:
  uni-live:
    image: python:3.12-slim
    container_name: uni-live
    restart: unless-stopped
    ports:
      - "8092:8092"
    environment:
      UNIFI_HOST: 10.0.0.16
      UNIFI_PORT: "8443" # direct LAN IP; the FQDN hairpins out the WAN (no split-horizon DNS) and takes 10–25s
      UNIFI_USERNAME: unifi-mcp
      UNIFI_PASSWORD: ${UNIFI_PASSWORD:?set UNIFI_PASSWORD in .env}
      SERVE_PORT: "8092"
    volumes:
      - ./scripts/unifi_serve.py:/serve.py:ro
    command: python /serve.py
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
