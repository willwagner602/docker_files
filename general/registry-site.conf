# Server block for the local docker registry auth front (registry.yml).
# nginx-proxy-manager terminates TLS for registry.willwagner.me and proxies to
# general-registry-auth:80 over the shared npm network; this file then applies
# basic auth and the pull/push policy before proxying plain HTTP to the
# registry itself.
#
# Policy:
#   GET/HEAD (pulls)  — htpasswd credential required from any source.
#   PUT/PATCH/POST/DELETE (pushes) — same credential, but only from trusted
#     LAN/VLAN sources (rfc1918 + the docker networks on this host). A leaked
#     credential alone therefore cannot push from the internet.
# DELETE is additionally refused here regardless of source: the registry runs
# with REGISTRY_STORAGE_DELETE_ENABLED=false, so this guard just fails early
# and keeps blob-removal attempts out of the registry logs.
#
# docker login needs GET/HEAD/POST to /v2/ and /v2/auth endpoints plus
# PUT/PATCH on /v2/<name>/blobs/uploads/ for pushes — covered by the map below.

# Map the request method to "push"/"pull". Everything not GET/HEAD is a write.
map $request_method $registry_op {
    default push;
    GET     pull;
    HEAD    pull;
}

# Trusted sources for pushes: RFC1918 LAN, loopback, and the docker bridges on
# this host (compose networks live in 172.16.0.0/12 by default here).
geo $registry_push_allowed {
    default        0;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
    127.0.0.0/8    1;
}

# Throttle repeated auth attempts per client IP: 10 requests per second burst
# 20 shared across all auth-front vhosts (plenty for docker's parallel layer
# GETs, useless for brute force).
limit_req_zone $binary_remote_addr zone=registry-auth:10m rate=10r/s;

server {
    listen 80;

    # Docker's registry client requires this header present on challenge
    # responses (401s) to recognize the endpoint as a docker registry and
    # retry with credentials. nginx's own auth_basic 401 omits it, so it must
    # be added explicitly ("always" so it rides every response incl. 401s).
    add_header Docker-Distribution-Api-Version "registry/2.0" always;

    # Always answer 401 (not 403) on unauthorized access so docker prints a
    # proper credential prompt instead of a bare error.
    error_page 418 = @unauthorized;

    location /v2/ {
        limit_req zone=registry-auth burst=20 nodelay;

        auth_basic "docker registry";
        auth_basic_user_file /etc/nginx/htpasswd;

        # Pushes must come from trusted sources; pulls work from anywhere.
        # Default the gate to open; the `if` below overrides it from the geo
        # map only for push methods.
        set $push_gate 1;
        if ($registry_op = push) {
            set $push_gate $registry_push_allowed;
        }
        if ($push_gate = 0) {
            return 418;
        }

        # DELETE never reaches the registry.
        if ($request_method = DELETE) {
            return 418;
        }

        proxy_pass         http://general-registry:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # Docker's chunked uploads need buffering off to stream blobs through.
        proxy_request_buffering off;
        client_max_body_size 0;
    }

    # Docker pings /v2/ unauthenticated to discover the auth realm.
    location = /v2/ {
        limit_req zone=registry-auth burst=20 nodelay;
        proxy_pass http://general-registry:5000;
        proxy_set_header Host $host;
    }

    location @unauthorized {
        return 401 "registry push denied: pushes are LAN-only\n";
    }
}
