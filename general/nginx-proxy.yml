services:
  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:latest@sha256:52b2c59994f3d36acfcf70a1626f29734df0ed8c71bacc0269f78b6f939858bb'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - /home/wbw/data:/data
      - /home/wbw/letsencrypt:/etc/letsencrypt
    networks:
      - npm
      - couchdb-net
      - mindwtr-net


networks:
  npm:
    name: npm
    driver: bridge
  couchdb-net:
    name: couchdb-net
    driver: bridge
  mindwtr-net:
    name: mindwtr-net
    driver: bridge
