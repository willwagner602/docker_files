services:
  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - /home/wbw/data:/data
      - /home/wbw/letsencrypt:/etc/letsencrypt
    networks:
      - npm


networks:
  npm:
    name: npm
    driver: bridge
