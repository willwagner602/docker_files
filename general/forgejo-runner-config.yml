# Forgejo runner baseline. Keep labels identical to those supplied during
# runner registration; mismatches leave workflows queued indefinitely.
runner:
  file: .runner
  capacity: 1
  timeout: 3h
  shutdown_timeout: 0s
  labels:
    - docker:docker://forgejo-ci-base:latest
    - self-hosted:docker://forgejo-ci-base:latest
    # GitHub-style workflows (runs-on: ubuntu-latest) map to the same base
    # image, so mirrored repos queue instead of stalling.
    - ubuntu-latest:docker://forgejo-ci-base:latest

container:
  docker_host: automount
  privileged: false
  options:
  valid_volumes: []
  # Jobs join this bridge (forgejo attached + internet egress) so the
  # http://forgejo:3000 clone URL resolves and package fetches work.
  network: forgejo-ci
  enable_ipv6: false

cache:
  enabled: true
  dir: /data/.cache
  host: ""
  port: 0

host:
  workdir_parent:

log:
  level: info

server:
  connections:
    forgejo:
      url: http://forgejo:3000
      uuid: 36623063-3865-3464-6631-333934646339
      token_url: file:/data/token
