# Forgejo runner baseline. Keep labels identical to those supplied during
# runner registration; mismatches leave workflows queued indefinitely.
runner:
  file: .runner
  capacity: 1
  timeout: 3h
  shutdown_timeout: 0s
  labels:
    - docker:docker://forgejo.willwagner.me/wbw602/forgejo-ci-base:latest
    - self-hosted:docker://forgejo.willwagner.me/wbw602/forgejo-ci-base:latest
    - ubuntu-latest:docker://forgejo.willwagner.me/wbw602/forgejo-ci-base:latest

container:
  # Runner and jobs go through the filtered Docker API proxy instead of the
  # raw host socket; see forgejo-docker-proxy in forgejo.yml. act_runner
  # exports this as DOCKER_HOST inside job containers, so image build/push
  # workflows keep working without a socket mount.
  docker_host: tcp://forgejo-docker-proxy:2375
  force_pull: true
  privileged: false
  options:
  valid_volumes: []
  # Jobs join this bridge (forgejo attached + internet egress) so the
  # http://forgejo:3000 clone URL resolves and package fetches work.
  network: forgejo-ci
  enable_ipv6: false

cache:
  enabled: true
  dir: /data/.cache
  host: ""
  port: 0

host:
  workdir_parent:

log:
  level: info

server:
  connections:
    forgejo:
      url: http://forgejo:3000
      uuid: 36623063-3865-3464-6631-333934646339
      token_url: file:/data/token
