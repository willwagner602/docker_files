services:
  otrecorder:
    image: owntracks/recorder:latest@sha256:050c3ac9ed798d4110f12e53851e94f9fa0fcecb16cf4d7457967eac2e498da7
    environment:
      - OTR_HOST=mosquitto
      - OTR_PORT=1883
    ports:
      - 8083:8083
    volumes:
      - otr-config:/config
      - otr-store:/store
    restart: unless-stopped

volumes:
  otr-config:
  otr-store:
