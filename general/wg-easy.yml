services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest@sha256:5f26407fd2ede54df76d63304ef184576a6c1bb73f934a58a11abdd852fab549
    container_name: wg-easy
    environment:
      - WG_HOST=vpn.willwagner.me
    networks:
      - npm
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


networks:
  npm:
    name: npm
    driver: bridge

volumes:
  etc_wireguard:
    # Pre-existing volume created under the old "wbw" compose project name.
    # Pinned explicitly so the rename to "general" doesn't strand the data.
    name: wbw_etc_wireguard
    external: true
