# Daily backup of the full "general" deployment. The script is shared with the
# media stack (scripts/backup.sh); what to protect is declared entirely in the
# environment below, which scripts/tests/backup/tests.sh cross-references
# against every other service's mounts: adding a container whose state is not
# covered fails `make test` and CI.
#
# All protected state is mounted READ-ONLY — this container needs no docker
# socket. The zip lands in the Google Drive "Server Backups" directory
# (locally synced at /mnt/smallHDD/google-drive); rclone push off-box is a
# documented follow-up in README.md.
services:
  backup:
    image: docker:29-cli
    container_name: backup-general
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # tzdata for BACKUP_AT in local time; zip for the archive itself; sqlite
    # for consistent sqlite3 .backup copies of hot SQLite databases.
    command: sh -c "apk add --no-cache sqlite tzdata zip >/dev/null && exec sh /backup.sh"
    environment:
      - TZ=America/Los_Angeles
      - ROLE=general
      - DEST_DIR=/backups
      - BACKUP_AT=04:00
      - KEEP_DAILY=7
      - KEEP_WEEKLY=11
      - KEEP_MONTHLY=9
      # Host paths to back up, mirroring the host layout inside the zip.
      - BACKUP_PATHS=/mnt/halfToshibaB/docker/data/homeassistant /mnt/halfToshibaB/docker/data/pihole /mnt/halfToshibaB/docker/data/dnsmasq /mnt/halfToshibaB/docker/data/nginx-proxy-data /mnt/halfToshibaB/docker/data/letsencrypt /mnt/halfToshibaB/docker/data/mongo /mnt/halfToshibaB/docker/data/unifi-config /mnt/halfToshibaB/docker/data/couchdb /mnt/halfToshibaB/docker/data/job-digest/state /mnt/halfToshibaB/docker/data/job-digest/secrets.json /mnt/halfToshibaB/docker/data/health-notify/general /home/wbw/work/job-search-tooling /home/wbw/work/docker_files
      # /mnt/halfToshibaB/docker/data/mindwtr was dropped 2026-10 with the
      # decommissioned Mindwtr Cloud service; the on-host directory is slated
      # for deletion. Deliberate removal — do not re-add.
      # Named volumes to back up (logical compose names).
      - BACKUP_VOLUMES=mosquitto-data mosquitto-logs mosquitto-conf otr-config otr-store tailscale-state etc_wireguard zwave-config komodo-mongo-data komodo-mongo-config komodo-keys
      # Service mounts deliberately NOT backed up, with the reason:
      #   /proc — host process table mounted for the Komodo agent.
      #   /etc/komodo — Periphery root dir for Komodo-managed stacks; empty
      #     in this monitoring-only setup.
      #   /etc/komodo/backups — Komodo Core's own dated DB dumps; redundant
      #     with the komodo-mongo-* volumes that are backed up directly.
      - EXCLUDED_MOUNTS=/var/run/docker.sock /etc/localtime /lib/modules /proc /etc/komodo
      # Backup paths that no service mounts (repo copy for restorability).
      # The tracked job-digest config and the test-support scripts ride in via
      # the repo copy; their git history is the backup.
      - EXTRA_BACKUP_PATHS=/home/wbw/work/job-search-tooling /home/wbw/work/docker_files
      # Exclude transient SQLite sidecars and obsolete/corrupt HA database files.
      # HA snapshots and rotated logs are disposable; Pi-hole's FTL query DB is
      # history only (gravity.db retains the blocklist state).
      # Mongo diagnostic.data contains FTDC support metrics, not database state;
      # Komodo FTDC collection remains enabled but capped in komodo.yml. The
      # Sep 22 pre-recovery Mongo snapshot was retained through the Oct 11
      # archives and is no longer on disk; restored copies may still contain it.
      # Job-digest production-artifacts/ are intermediate per-run outputs; its
      # durable state and completed digests remain included.
      - EXCLUDES=*home-assistant_v2.db-wal *home-assistant_v2.db-shm *pihole/*-wal *pihole/*-shm *home-assistant_v2.db.corrupt.* *home-assistant_v2.db-wal.corrupt.* *home-assistant_v2.db-shm.corrupt.* *mnt/halfToshibaB/docker/data/homeassistant/backups/* *home-assistant.log* *pihole/pihole-FTL.db *diagnostic.data/* *mongo/db.before-raw-recovery-*/* *job-digest/state/production-artifacts/*
      # The run lock lives on local disk (mounted at /locks), OUTSIDE the
      # synced google-drive mirror, so the backup can never fence the bisync
      # the way the 2026-10-12 ".backup-lock/pid" collision did (media host
      # precedent: BACKUP_LOCK_DIR=/locks + /bigdisk/backup-locks).
      - BACKUP_LOCK_DIR=/locks
    volumes:
      - ../scripts/backup.sh:/backup.sh:ro
      - "/mnt/smallHDD/google-drive/Server Backups:/backups"
      # --- run lock (smallHDD but outside the bisynced "Server Backups" tree) ---
      - /mnt/smallHDD/backup-locks:/locks
      # --- protected bind-mount state (read-only) ---
      - /mnt/halfToshibaB/docker/data/homeassistant:/backup-roots/mnt/halfToshibaB/docker/data/homeassistant:ro
      - /mnt/halfToshibaB/docker/data/pihole:/backup-roots/mnt/halfToshibaB/docker/data/pihole:ro
      - /mnt/halfToshibaB/docker/data/dnsmasq:/backup-roots/mnt/halfToshibaB/docker/data/dnsmasq:ro
      - /mnt/halfToshibaB/docker/data/nginx-proxy-data:/backup-roots/mnt/halfToshibaB/docker/data/nginx-proxy-data:ro
      - /mnt/halfToshibaB/docker/data/letsencrypt:/backup-roots/mnt/halfToshibaB/docker/data/letsencrypt:ro
      - /mnt/halfToshibaB/docker/data/mongo:/backup-roots/mnt/halfToshibaB/docker/data/mongo:ro
      - /mnt/halfToshibaB/docker/data/unifi-config:/backup-roots/mnt/halfToshibaB/docker/data/unifi-config:ro
      - /mnt/halfToshibaB/docker/data/couchdb:/backup-roots/mnt/halfToshibaB/docker/data/couchdb:ro
      - /mnt/halfToshibaB/docker/data/job-digest/state:/backup-roots/mnt/halfToshibaB/docker/data/job-digest/state:ro
      - /mnt/halfToshibaB/docker/data/job-digest/secrets.json:/backup-roots/mnt/halfToshibaB/docker/data/job-digest/secrets.json:ro
      - /mnt/halfToshibaB/docker/data/health-notify/general:/backup-roots/mnt/halfToshibaB/docker/data/health-notify/general:ro
      - /home/wbw/work/job-search-tooling:/backup-roots/home/wbw/work/job-search-tooling:ro
      - /home/wbw/work/docker_files:/backup-roots/home/wbw/work/docker_files:ro
      # --- protected named volumes (read-only) ---
      - mosquitto-data:/volume-roots/mosquitto-data:ro
      - mosquitto-logs:/volume-roots/mosquitto-logs:ro
      - mosquitto-conf:/volume-roots/mosquitto-conf:ro
      - otr-config:/volume-roots/otr-config:ro
      - otr-store:/volume-roots/otr-store:ro
      - tailscale-state:/volume-roots/tailscale-state:ro
      - etc_wireguard:/volume-roots/etc_wireguard:ro
      - zwave-config:/volume-roots/zwave-config:ro
      - komodo-mongo-data:/volume-roots/komodo-mongo-data:ro
      - komodo-mongo-config:/volume-roots/komodo-mongo-config:ro
      - komodo-keys:/volume-roots/komodo-keys:ro
