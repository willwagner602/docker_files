services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=plex
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ombi
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - /media/plex/database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
