services:
  plex:
    image: linuxserver/plex
    container_name: plex
    restart: unless-stopped
    ports:
      - 32400:32400/tcp
      - 3005:3005/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    environment:
      - PUID=1001
      - PGID=1001
      - VERSION=docker
      - PLEX_CLAIM=claim-nxB1xXcXiSxxmT76p_m_
      - TZ=America/Los_Angeles
    volumes:
      - /media/plex/plex:/config
      - /media/plex/tv:/tv
      - /media/plex/movies:/movies

  ombi:
    image: linuxserver/ombi
    container_name: ombi
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=America/Los_Angeles
      - BASE_URL=/ombi #optional
    volumes:
      - /media/plex/ombi:/config
    ports:
      - 3579:3579
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:3.0.10
    container_name: sonarr
    restart: unless-stopped
    environment:
      - UMASK_SET=022
      - TZ=America/Los_Angeles
      - PUID=1001
      - PGID=1001
    volumes:
      - /media/plex/:/data
      - /media/plex/sonarr:/config
    ports:
      - 8989:8989/tcp

  radarr:
    image: linuxserver/radarr:4.4.4
    container_name: radarr
    restart: unless-stopped
    environment:
      - UMASK_SET=022
      - TZ=America/Los_Angeles
      - PUID=1001
      - PGID=1001
    volumes:
      - /media/plex/:/data
      - /media/plex/radarr:/config
    ports:
      - 7878:7878/tcp

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      - PUID=1001
      - PGID=1001
      - UMASK=002
      - TZ=America/Los_Angeles
    volumes:
      - /media/prowlarr/:/config
    hostname: container-name.internal #

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Europe/London
    ports:
      - "${PORT:-8191}:8191"
    restart: unless-stopped

  sabnzbd:
    container_name: sabnzbd
    image: ghcr.io/hotio/sabnzbd
    restart: unless-stopped
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 8 https://1.1.1.1 -o /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    ports:
      - "9090:9090"
    environment:
      - PUID=1001
      - PGID=1001
      - UMASK=002
      - TZ=America/Los_Angeles
      - WEBUI_PORTS=9090/tcp,9090/udp
      - VPN_ENABLED=true #
      - VPN_CONF=wg0 #
      - VPN_PROVIDER=pia #
      - VPN_LAN_NETWORK=10.0.0.0/24 #
      - VPN_LAN_LEAK_ENABLED=false #
      - VPN_EXPOSE_PORTS_ON_LAN=9090/tcp #
      - VPN_AUTO_PORT_FORWARD=true #
      - VPN_AUTO_PORT_FORWARD_TO_PORTS= #
      - VPN_FIREWALL_TYPE=auto #
      - VPN_HEALTHCHECK_ENABLED=false #
      - VPN_NAMESERVERS= #
      - VPN_PIA_USER=${PIA_USER} #
      - VPN_PIA_PASS=${PIA_PASS} #
      - VPN_PIA_PREFERRED_REGION #
      - VPN_PIA_DIP_TOKEN=no #
      - VPN_PIA_PORT_FORWARD_PERSIST=false #
      - PRIVOXY_ENABLED=false #
      - UNBOUND_ENABLED=false #
      - UNBOUND_NAMESERVERS #
    volumes:
      - /media/sabnzbd/config:/config
      - /media/plex:/data
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1 #
      - net.ipv6.conf.all.disable_ipv6=1 #

  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
      - UN_LOG_FILE=/config/unpackerr.log
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/data
      - UN_SONARR_0_PROTOCOLS=torrent,TorrentDownloadProtocol
      - UN_SONARR_0_DELETE_ORIG=false
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/data
      - UN_RADARR_0_PROTOCOLS=torrent,TorrentDownloadProtocol
      - UN_RADARR_0_DELETE_ORIG=false
    volumes:
      - /media/plex:/data
      - /home/wbw/unpackerr:/config

  qbittorrent:
    container_name: qbittorrent
    image: ghcr.io/hotio/qbittorrent
    restart: unless-stopped
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 8 https://1.1.1.1 -o /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    ports:
      - "8080:8080"
    environment:
      - PUID=1001
      - PGID=1001
      - UMASK=002
      - TZ=America/Los_Angeles
      - WEBUI_PORTS=8080/tcp,8080/udp
      - LIBTORRENT=v1
      - VPN_ENABLED=true #
      - VPN_CONF=wg0 #
      - VPN_PROVIDER=pia #
      - VPN_LAN_NETWORK=10.0.0.0/24 #
      - VPN_LAN_LEAK_ENABLED=false #
      - VPN_EXPOSE_PORTS_ON_LAN=8080/tcp #
      - VPN_AUTO_PORT_FORWARD=true #
      - VPN_AUTO_PORT_FORWARD_TO_PORTS= #
      - VPN_FIREWALL_TYPE=auto #
      - VPN_HEALTHCHECK_ENABLED=false #
      - VPN_NAMESERVERS= #
      - VPN_PIA_USER=${PIA_USER} #
      - VPN_PIA_PASS=${PIA_PASS} #
      - VPN_PIA_PREFERRED_REGION #
      - VPN_PIA_DIP_TOKEN=no #
      - VPN_PIA_PORT_FORWARD_PERSIST=false #
      - PRIVOXY_ENABLED=false #
      - UNBOUND_ENABLED=false #
      - UNBOUND_NAMESERVERS #
    volumes:
      - /media/qbittorrent/config:/config
      - /media/plex:/data
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1 #
      - net.ipv6.conf.all.disable_ipv6=1 #

  frigate:
    container_name: frigate
    privileged: true # this may not be necessary for all setups
    restart: unless-stopped
    stop_grace_period: 30s # allow enough time to shut down the various services
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: "512mb" # update for your cameras based on calculation above
    devices:
      - /dev/bus/usb:/dev/bus/usb # Passes the USB Coral, needs to be modified for other versions
      - /dev/apex_0:/dev/apex_0 # Passes a PCIe Coral, follow driver instructions here https://coral.ai/docs/m2/get-started/#2a-on-linux
      - /dev/video11:/dev/video11 # For Raspberry Pi 4B
      - /dev/dri/renderD128:/dev/dri/renderD128 # For intel hwaccel, needs to be updated for your hardware
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /config/frigate:/config
      - /media/frigate:/media/frigate
    ports:
      - "8971:8971"
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
    environment:
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD}

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=plex
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ombi
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - /media/plex/database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=90
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  health-notify:
    image: docker:cli
    container_name: health-notify
    restart: unless-stopped
    command: sh -c "apk add --no-cache ca-certificates curl jq openssl >/dev/null && sh /notify.sh"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SAB_API_KEY=${SAB_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - STATE_DIR=/state
      - POLL_INTERVAL=60
      - STALL_SECONDS=3600
      - DISK_FREE_THRESHOLD=25
      - CERT_WARN_DAYS=30
      - CERT_HOST=willwagner.me
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/wbw/scripts/health-notify.sh:/notify.sh:ro
      - /home/wbw/health-notify:/state
      - /media/plex:/data:ro
